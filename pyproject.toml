[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "orbynth"
version = "0.1.0"
description = "ORBYNTH — a desktop-resident, voice-first, multi-agent AI operative"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
desktop = [
  "pynput>=1.7",
  "pyautogui>=0.9.54",
  "mss>=9.0",
  "Pillow>=10.3",
  "playwright>=1.45",
  "websocket-client>=1.7",
]
windows = [
  "uiautomation>=2.0",
  "pywin32>=306",
  "pywinauto>=0.6.8",
]
macos = ["pyobjc-framework-Quartz>=10.3", "pyobjc-framework-ApplicationServices>=10.3"]
linux = ["pyatspi>=2.46"]
voice = [
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "faster-whisper>=1.0",
  "openwakeword>=0.6",
  "edge-tts>=6.1",
]
vision = ["rapidocr-onnxruntime>=1.3", "opencv-python-headless>=4.10"]
hud = ["pywebview>=5.1"]
packaging = ["pyinstaller>=6.6"]
all = [
  "orbynth[desktop,windows,voice,vision,hud]",
]

[project.scripts]
orbynth = "orbynth.cli:main"

[tool.setuptools]
packages = [
  "orbynth",
  "orbynth.llm",
  "orbynth.agents",
  "orbynth.actions",
  "orbynth.plugins",
  "orbynth.ops",
  "orbynth.voice",
  "orbynth.hud",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
